<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="darkreader-lock">
<title>Agent Lab Console</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=Geist:wght@300..700&family=Geist+Mono:wght@400..700&display=swap">
<link rel="stylesheet" href="/app.css">
<script src="/theme.js"></script>
<script src="/app.js" defer></script>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">agent<span>/</span>lab</div>
    <nav class="nav" id="nav-main"></nav>
    <nav class="nav" id="nav-agents"></nav>
    <div class="rail-foot" id="rail-foot"></div>
  </aside>
  <main class="main" id="main">
    <header class="top">
      <h1 id="title" class="v-name">Live</h1>
      <div class="status" id="status"></div>
      <button class="icon-btn theme-btn" id="theme" title="Light or dark" aria-label="Switch between light and dark"></button>
      <button class="act" id="reconnect-all" title="Drop every live stream and reconnect">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2.5v3h-3"/></svg>
        <span>Reconnect all</span></button>
    </header>
    <div id="banner"></div>
    <div id="view"></div>
  </main>
</div>
</body>
</html>
