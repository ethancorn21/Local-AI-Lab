# Agent c: a second copy of the model on the plain RTX 3090, port 8081 (.env.c). Its own compose project
# (hyperqwen-c), so its containers and compile cache are separate from agent a's.
#   sudo docker compose -p hyperqwen-c --env-file .env.c -f docker-compose.yml -f docker-compose.c.yml --profile single up -d single
services:
  prepare:
    env_file: !override
      - path: .env.c
  single:
    env_file: !override
      - path: .env.c
